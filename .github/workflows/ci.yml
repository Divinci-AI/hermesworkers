name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check + test Worker
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (not moving tags) for supply-chain safety.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Fail the build on known high/critical advisories in the code that ships
      # to the Worker runtime. Dev tooling (wrangler/vitest and their transitive
      # deps) is excluded — it never reaches production and would otherwise pin
      # the gate to whatever wrangler's toolchain currently vendors.
      - name: Dependency audit (production tree)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: Build Hermes Sandbox image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./container
          file: ./container/Dockerfile
          push: false
          load: true
          tags: hermesworkers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke check
        run: |
          docker run --rm hermesworkers:ci /usr/local/bin/hermes --version
          docker run --rm hermesworkers:ci /usr/local/bin/hermes dashboard --help > /dev/null
